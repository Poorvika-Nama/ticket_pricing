[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinema-pricing-engine"
version = "0.1.0"
description = "A phased Python ticket pricing engine for cinema bookings."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["pricing_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
